<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CULINDEX — a recorded dish from the Culinary Heritage Index of Kerala and Tamil Nadu." />
  <meta name="theme-color" content="#F7F5F0" />
  <title>CULINDEX | Dish Record</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --text: #1A1F22;
      --muted: #5b646b;
      --border: rgba(26, 31, 34, 0.14);
      --spice: #A33B24;
      --spice-hover: #822C19;
      --leaf: #2A4732;
      --radius: 10px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.04);
      --font-heading: "Lora", serif;
      --font-body: "Inter", system-ui, sans-serif;
      --content-width: 880px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 4.5rem;
    }

    body {
      font-family: var(--font-body);
      color: var(--text);
      background-color: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; transition: color 0.2s ease; }
    a:hover { color: var(--spice); }

    img, svg { display: block; max-width: 100%; }

    .container {
      width: min(100% - 1.5rem, var(--content-width));
      margin-inline: auto;
      padding-inline: 1.25rem;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(247, 245, 240, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 0;
    }

    .brand {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .brand span { color: var(--spice); }

    .nav-links {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }
    .nav-links a {
      font-size: 0.82rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .nav-links a:hover { color: var(--spice); }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      padding: 0.25rem;
    }

    .back-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .breadcrumb a:hover { color: var(--spice); }
    .breadcrumb .sep { color: var(--border); }

    .btn-ghost { 
      background: transparent; 
      color: var(--text); 
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 1rem;
      border-radius: var(--radius);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }
    .btn-ghost:hover { color: var(--spice); border-color: var(--spice); }

    .dish-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 1.75rem;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 1.75rem;
      align-items: start;
      margin-top: 1.5rem;
    }

    .dish-image {
      width: 220px;
      height: 220px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--bg);
      box-shadow: var(--shadow-sm);
    }
    .dish-image-placeholder {
      width: 220px;
      height: 220px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .dish-name {
      font-family: var(--font-heading);
      font-size: 1.7rem;
      line-height: 1.15;
      font-weight: 500;
      margin-bottom: 0.3rem;
    }
    .dish-name-local {
      color: var(--muted);
      font-style: italic;
      font-family: var(--font-heading);
      margin-bottom: 0.75rem;
    }
    .dish-cuisine {
      display: inline-block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--leaf);
      background: rgba(42, 71, 50, 0.08);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      margin-bottom: 0.75rem;
    }
    .dish-brief {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .dish-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin: 1rem 0 1.25rem;
      padding: 0.9rem 1rem;
      background: rgba(0,0,0,0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .dish-meta dt {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }
    .dish-meta dd {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }

    .dish-section {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    .dish-section h3 {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      color: var(--leaf);
      margin-bottom: 0.5rem;
    }
    .dish-place-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.6rem;
    }

    .record-placeholder {
      background: rgba(163, 59, 36, 0.04);
      border: 1px dashed var(--spice);
      border-radius: 8px;
      padding: 1rem 1.1rem;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 1rem;
    }
    .record-placeholder strong {
      color: var(--text);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--muted);
    }
    .empty-state h2 {
      font-family: var(--font-heading);
      color: var(--leaf);
      margin-bottom: 0.5rem;
    }

    .site-footer {
      background: var(--text);
      color: #fff;
      padding: 3rem 0 2.5rem;
      margin-top: 4rem;
    }

    @media (max-width: 768px) {
      .dish-card {
        grid-template-columns: 1fr;
      }
      .dish-image, .dish-image-placeholder {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
      }
      .nav-links { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background: rgba(247,245,240,0.98); padding: 1rem 0; border-bottom: 1px solid var(--border); }
      .nav-links.active { display: flex; }
      .mobile-menu-btn { display: block; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand">CUL<span>INDEX</span></a>
      <button class="mobile-menu-btn" aria-label="Toggle navigation" aria-expanded="false">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <nav class="nav-links">
        <a href="index.html">Map</a>
        <a href="index.html#about">Project</a>
        <a href="index.html#team">Team</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div id="dish-root">
        <div class="back-bar">
          <span class="breadcrumb">
            <a href="index.html">CULINDEX</a>
            <span class="sep">/</span>
            <span id="breadcrumb-dish">Dish record</span>
          </span>
          <a href="index.html" class="btn-ghost" style="margin-left:auto;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:6px;">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to map
          </a>
        </div>

        <div class="dish-card" id="dish-card">
           <div style="padding:2rem; color:var(--muted);">Loading dish record...</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;color:rgba(255,255,255,0.7);font-size:0.8rem;">
        <p>&copy; 2026 CULINDEX. All rights reserved.</p>
        <p>Hosted via GitHub Pages</p>
        <p>Developed and Managed by <a href="https://jorlin.in/">jorlin.in</a></p>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';

      var root = document.getElementById('dish-root');
      var card = document.getElementById('dish-card');
      var breadcrumb = document.getElementById('breadcrumb-dish');
      if (!root || !card) return;

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
        });
      }

      function renderNotFound(reason) {
        root.innerHTML =
          '<div class="empty-state">' +
            '<h2>No dish record found</h2>' +
            '<p>' + escapeHtml(reason) + '</p>' +
            '<p style="margin-top:0.75rem;"><a href="index.html" style="color:var(--spice);font-weight:500;">Return to the map</a></p>' +
          '</div>';
        if (breadcrumb) breadcrumb.textContent = 'Not found';
      }

      // Updated: Directly uses dish.place_id instead of needing a placeLookup
      function renderPlaceLink(placeId) {
        var out = '<div class="dish-place-link">';
        if (placeId) {
          out += '<a href="index.html?place_id=' + encodeURIComponent(placeId) + '" style="color:var(--spice);font-weight:600;display:inline-flex;align-items:center;">';
          out += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:6px;">';
          out += '<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>';
          out += '<line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line>';
          out += '</svg>';
          out += 'View location on map';
          out += '</a>';
        }
        out += '</div>';
        return out;
      }

      function renderDish(dish) {
        var img = dish && dish.image_small
          ? '<img class="dish-image" src="' + escapeHtml(dish.image_small) + '" alt="' + escapeHtml(dish.name) + '" loading="lazy" />'
          : '<div class="dish-image-placeholder">Dish image pending</div>';

        var local = dish && dish.name_local ? dish.name_local : '';
        var cuisine = dish && dish.cuisine ? dish.cuisine : '';
        var district = dish && dish.district ? dish.district : '';
        var state = dish && dish.state ? dish.state : '';
        var brief = dish && dish.brief ? dish.brief : '';
        var prep = dish && dish.prep_time ? dish.prep_time : '';
        var featured = !!(dish && dish.featured);

        var featuredLine = featured
          ? '<span class="dish-cuisine" style="background:rgba(163,59,36,0.1);color:var(--spice);">Featured record</span>'
          : '';

        var metaHtml = '';
        if (cuisine || district || state || prep) {
          metaHtml = '<dl class="dish-meta">';
          if (cuisine) metaHtml += '<div><dt>Cuisine</dt><dd>' + escapeHtml(cuisine) + '</dd></div>';
          if (district || state) metaHtml += '<div><dt>Region</dt><dd>' + escapeHtml(district) + (state ? ', ' + escapeHtml(state) : '') + '</dd></div>';
          if (prep) metaHtml += '<div><dt>Prep time</dt><dd>' + escapeHtml(prep) + '</dd></div>';
          if (dish && dish.dish_id) metaHtml += '<div><dt>Record ID</dt><dd>' + escapeHtml(dish.dish_id) + '</dd></div>';
          metaHtml += '</dl>';
        }

        var placeLink = renderPlaceLink(dish.place_id);

        var sections = '';
        sections += '<div class="dish-section">';
        sections += '<h3>About this record</h3>';
        if (brief) {
          sections += '<p class="dish-brief">' + escapeHtml(brief) + '</p>';
        } else {
          sections += '<p class="dish-brief" style="font-style:italic;">Brief description pending.</p>';
        }
        sections += placeLink;
        sections += '</div>';

        sections += '<div class="dish-section">';
        sections += '<h3>Full record</h3>';
        sections += '<div class="record-placeholder">';
        sections += '<strong>Coming soon.</strong> ';
        sections += 'The complete dish record — ingredients, method, variations, oral-history notes, sources, and any associated media — will appear here once the data is approved for publication.';
        sections += '</div>';
        sections += '</div>';

        card.innerHTML =
          img +
          '<div>' +
            '<div class="dish-name">' + escapeHtml(dish.name) + '</div>' +
            (local ? '<div class="dish-name-local">' + escapeHtml(local) + '</div>' : '') +
            featuredLine +
            (cuisine ? '<span class="dish-cuisine">' + escapeHtml(cuisine) + '</span>' : '') +
            metaHtml +
            sections +
          '</div>';
        if (breadcrumb) breadcrumb.textContent = escapeHtml(dish.name);
      }

      var menuBtn = document.querySelector('.mobile-menu-btn');
      var navLinks = document.querySelector('.nav-links');
      if (menuBtn && navLinks) {
        menuBtn.addEventListener('click', function () {
          var open = navLinks.classList.toggle('active');
          menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        navLinks.querySelectorAll('a').forEach(function (link) {
          link.addEventListener('click', function () {
            navLinks.classList.remove('active');
            menuBtn.setAttribute('aria-expanded', 'false');
          });
        });
      }

      var params = new URLSearchParams(location.search);
      var dishId = params.get('dish_id');

      if (!dishId) {
        renderNotFound('No dish was specified. Use the map to open a recorded dish.');
        return;
      }

      fetch('data/dishes.json')
        .then(function (r) { if (!r.ok) throw new Error('network'); return r.json(); })
        .then(function (bundle) {
          var dishes = bundle && bundle.dishes ? bundle.dishes : [];
          var dish = null;
          for (var i = 0; i < dishes.length; i++) {
            if (dishes[i] && dishes[i].dish_id === dishId) { dish = dishes[i]; break; }
          }
          if (!dish) {
            renderNotFound('We could not find a dish with id ' + escapeHtml(dishId) + '. It may not be published yet.');
            return;
          }
          renderDish(dish);
        })
        .catch(function () {
          renderNotFound('We could not load the dish index right now. Please check your internet connection and try again.');
        });
    })();
  </script>
</body>
</html>
